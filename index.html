<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LCC ScanMate</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    :root {
      --primary: #003366;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
      --card-bg: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; padding: 12px; background: #f8fafc;
      transition: background-color 0.2s ease;
    }

    body.scan-valid { background-color: #dcfce7 !important; }
    body.scan-duplicate { background-color: #fef3c7 !important; }
    body.scan-invalid { background-color: #fee2e2 !important; }

    .card {
      background: var(--card-bg); border-radius: 12px; padding: 14px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06); margin-bottom: 10px;
    }
    .form-group { margin-bottom: 10px; }
    label { font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 4px; display: block; }
    select, input {
      width: 100%; padding: 11px; border-radius: 8px; border: 1px solid #cbd5e1;
      font-size: 14px; background: #fff;
    }
    button {
      width: 100%; padding: 13px; border-radius: 8px; border: none;
      font-size: 15px; font-weight: 700; cursor: pointer; color: #fff; background: var(--primary);
    }
    .btn-secondary { background: #64748b; margin-top: 8px; }
    .btn-outline { background: transparent; color: var(--primary); border: 2px solid var(--primary); margin-top: 8px; }
    .btn-small { width: auto; padding: 6px 12px; font-size: 12px; }

    #feedbackBanner {
      display: none; padding: 8px 12px; border-radius: 20px; text-align: center;
      font-weight: 700; font-size: 13px; margin: 0 auto 10px auto; max-width: 90%;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    #reader { width: 100%; border-radius: 10px; overflow: hidden; background: #000; }
    .badge {
      display: inline-block; padding: 3px 8px; border-radius: 12px;
      font-size: 11px; font-weight: bold;
    }
    .online { background: #dcfce7; color: #166534; }
    .offline { background: #fee2e2; color: #991b1b; }

    /* Modal Overlay */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65);
      align-items: center; justify-content: center; padding: 16px; z-index: 100;
    }
    .modal-overlay.active { display: flex; }
    .modal-card { background: #fff; padding: 18px; border-radius: 12px; width: 100%; max-width: 440px; max-height: 85vh; display: flex; flex-direction: column; }
    
    .record-list { overflow-y: auto; margin-top: 10px; flex-grow: 1; }
    .record-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 0; border-bottom: 1px solid #f1f5f9; font-size: 13px;
    }
  </style>
</head>
<body>

  <!-- VIEW 1: SESSION SETUP -->
  <div id="setupView" class="card">
    <h3 style="margin-top:0; color:var(--primary);">LCC ScanMate Setup</h3>
    
    <div class="form-group">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
        <label style="margin:0;">Select Event</label>
        <a href="javascript:void(0)" onclick="toggleNewEventField()" style="font-size:12px; color:var(--primary); font-weight:600;">+ New Event</a>
      </div>
      <select id="eventSelect">
        <option value="">Loading events...</option>
      </select>
    </div>

    <div id="newEventGroup" style="display:none; background:#f1f5f9; padding:10px; border-radius:8px; margin-bottom:10px;">
      <label>New Event Title</label>
      <input type="text" id="newEventTitle" placeholder="e.g., General Convocation">
      <label style="margin-top:6px;">Academic Year</label>
      <input type="text" id="newEventAY" value="2026-2027">
    </div>

    <div class="form-group">
      <label>Secretary Name / Station Section</label>
      <input type="text" id="secretaryInput" placeholder="e.g., Jane Doe (BSIT 3A)">
    </div>

    <button onclick="startSession()">Start Attendance Session</button>
    <button onclick="openPasscodeModal()" class="btn-outline">View Attendance Records</button>
  </div>

  <!-- VIEW 2: ACTIVE SCANNER VIEW -->
  <div id="scannerView" style="display:none;">
    <div id="feedbackBanner"></div>

    <div class="card" style="padding: 12px;">
      <div style="display:flex; justify-content:space-between; align-items:flex-start;">
        <div>
          <span id="activeEventTitle" style="font-weight:700; font-size:14px; color:#0f172a;"></span>
          <div id="activeSecretaryName" style="font-size:11px; color:#64748b;"></div>
        </div>
        <div style="text-align: right;">
          <span id="netStatus" class="badge online">ONLINE</span>
          <div style="font-size:11px; color:#475569; margin-top:3px;">
            Queue: <b id="queueCount">0</b>
          </div>
        </div>
      </div>

      <div id="reader" style="margin-top:8px;"></div>

      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-top:10px;">
        <button onclick="triggerManualSync()" class="btn-small" style="background:#2563eb;">Sync Queue</button>
        <button onclick="exitSession()" class="btn-secondary btn-small" style="margin:0;">End Session</button>
      </div>
    </div>
  </div>

  <!-- MODAL 1: ENTER SECRET CODE -->
  <div id="passcodeModal" class="modal-overlay">
    <div class="modal-card">
      <h3 style="margin-top:0; color:var(--primary);">Restricted Access</h3>
      <p style="font-size:13px; color:#64748b;">Enter the authorized passcode to view attendance records:</p>
      
      <div class="form-group">
        <label>Security Passcode</label>
        <input type="password" id="secretPasscode" placeholder="Enter code">
      </div>

      <div class="form-group">
        <label>Filter By Event</label>
        <select id="viewerEventSelect"></select>
      </div>

      <button onclick="verifyAndFetchRecords()">Authenticate & View</button>
      <button onclick="closeModal('passcodeModal')" class="btn-secondary">Cancel</button>
    </div>
  </div>

  <!-- MODAL 2: ATTENDANCE RECORDS VIEWER -->
  <div id="recordsModal" class="modal-overlay">
    <div class="modal-card">
      <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #e2e8f0; padding-bottom:8px;">
        <div>
          <h3 id="viewerHeaderTitle" style="margin:0; font-size:16px; color:var(--primary);">Attendance</h3>
          <span style="font-size:12px; color:#64748b;">Unique Attendees: <b id="uniqueCountBadge">0</b></span>
        </div>
        <button onclick="closeModal('recordsModal')" class="btn-small btn-secondary" style="margin:0;">Close</button>
      </div>

      <div id="recordListContainer" class="record-list"></div>
    </div>
  </div>

  <!-- MODAL 3: REGISTER WALK-IN STUDENT -->
  <div id="walkInModal" class="modal-overlay">
    <div class="modal-card">
      <h3 style="margin-top:0; color:var(--danger); font-size:16px;">Student Not in Roster</h3>
      <p style="font-size:12px; color:#64748b; margin-top:-4px;">Enter details below to record attendance and add to masterlist:</p>
      
      <div class="form-group">
        <label>Student ID</label>
        <input type="text" id="modalId" readonly style="background:#f1f5f9;">
      </div>
      <div class="form-group">
        <label>Full Name (Last, First M.I.)</label>
        <input type="text" id="modalName" placeholder="e.g., Dela Cruz, Juan P.">
      </div>
      <div class="form-group">
        <label>Program / Department</label>
        <input type="text" id="modalProgram" placeholder="e.g., BSIT">
      </div>
      <div class="form-group">
        <label>Year Level</label>
        <input type="text" id="modalYear" placeholder="e.g., 3">
      </div>

      <button onclick="submitWalkIn()" style="background:var(--success);">Save & Record</button>
      <button onclick="closeModal('walkInModal')" class="btn-secondary">Dismiss</button>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwV0TcI8F2QoK06GhEO24VaO2IVpleJvq0hjKHtVbNcRvryMcIzvfhdPF8llReggu8bFQ/exec";

    let activeSession = null;
    let rosterCache = {};
    let eventList = [];
    let scanQueue = JSON.parse(localStorage.getItem("scanmate_queue") || "[]");
    let sessionScannedIds = new Set(JSON.parse(localStorage.getItem("session_scanned_ids") || "[]"));
    let html5QrCode = null;
    let isModalActive = false;
    let lastScan = { id: "", time: 0 };
    let isCreatingNewEvent = false;

    function playChime(type) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        osc.connect(ctx.destination);
        if (type === "valid") {
          osc.frequency.value = 880;
          osc.start();
          setTimeout(() => { osc.stop(); ctx.close(); }, 120);
        } else if (type === "duplicate") {
          osc.frequency.value = 520;
          osc.start();
          setTimeout(() => { osc.frequency.value = 440; }, 100);
          setTimeout(() => { osc.stop(); ctx.close(); }, 220);
        } else {
          osc.frequency.value = 260;
          osc.start();
          setTimeout(() => { osc.stop(); ctx.close(); }, 300);
        }
      } catch (e) {}
    }

    function toggleNewEventField() {
      isCreatingNewEvent = !isCreatingNewEvent;
      document.getElementById("newEventGroup").style.display = isCreatingNewEvent ? "block" : "none";
      document.getElementById("eventSelect").disabled = isCreatingNewEvent;
    }

    async function initApp() {
      rosterCache = JSON.parse(localStorage.getItem("scanmate_roster") || "{}");
      activeSession = JSON.parse(localStorage.getItem("scanmate_session") || "null");

      if (activeSession) {
        resumeScannerView();
        return;
      }
      await fetchRosterAndEvents();
    }

    async function fetchRosterAndEvents() {
      try {
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();
        
        if (data.status === "success") {
          rosterCache = data.roster;
          eventList = data.events;
          localStorage.setItem("scanmate_roster", JSON.stringify(rosterCache));

          const select = document.getElementById("eventSelect");
          const viewerSelect = document.getElementById("viewerEventSelect");

          if (eventList.length > 0) {
            const options = eventList.map(ev => `<option value="${ev.title}">${ev.title} (${ev.ay})</option>`).join("");
            select.innerHTML = options;
            viewerSelect.innerHTML = `<option value="ALL">All Events</option>` + options;
          } else {
            select.innerHTML = `<option value="DRIFT: Acquaintance">DRIFT: Acquaintance</option>`;
            viewerSelect.innerHTML = `<option value="ALL">All Events</option><option value="DRIFT: Acquaintance">DRIFT: Acquaintance</option>`;
          }
        }
      } catch (err) {
        document.getElementById("eventSelect").innerHTML = `<option value="OFFLINE">Offline Mode (Cached Roster)</option>`;
      }
    }

    // Modal Control
    function openPasscodeModal() {
      document.getElementById("secretPasscode").value = "";
      document.getElementById("passcodeModal").classList.add("active");
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove("active");
      isModalActive = false;
    }

    // Secure Record Fetcher
    async function verifyAndFetchRecords() {
      const passcode = document.getElementById("secretPasscode").value.trim();
      const selectedEvent = document.getElementById("viewerEventSelect").value;

      if (!passcode) {
        alert("Please enter the passcode.");
        return;
      }

      const btn = event.target;
      btn.innerText = "Verifying...";
      btn.disabled = true;

      try {
        const url = `${SCRIPT_URL}?action=view_logs&passcode=${encodeURIComponent(passcode)}&eventTitle=${encodeURIComponent(selectedEvent)}`;
        const res = await fetch(url);
        const data = await res.json();

        if (data.status === "unauthorized") {
          alert("Incorrect Passcode. Access denied.");
        } else if (data.status === "success") {
          closeModal("passcodeModal");
          displayRecords(data);
        } else {
          alert("Error: " + (data.message || "Failed to load records."));
        }
      } catch (err) {
        alert("Network error: Cannot reach database server.");
      } finally {
        btn.innerText = "Authenticate & View";
        btn.disabled = false;
      }
    }

    function displayRecords(data) {
      document.getElementById("viewerHeaderTitle").innerText = data.eventTitle === "ALL" ? "All Events" : data.eventTitle;
      document.getElementById("uniqueCountBadge").innerText = data.uniqueCount;

      const container = document.getElementById("recordListContainer");
      if (data.records.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding:20px; color:#64748b;">No attendance recorded yet.</div>`;
      } else {
        container.innerHTML = data.records.map((r, i) => `
          <div class="record-item">
            <div>
              <b>${i + 1}. ${r.name}</b>
              <div style="font-size:11px; color:#64748b;">ID: ${r.studentId} • ${r.program} ${r.year}</div>
            </div>
            <div style="text-align:right; font-size:11px; color:#64748b;">
              ${r.scannedBy ? "By: " + r.scannedBy : ""}
            </div>
          </div>
        `).join("");
      }

      document.getElementById("recordsModal").classList.add("active");
    }

    function startSession() {
      const secretary = document.getElementById("secretaryInput").value.trim();
      if (!secretary) {
        alert("Please enter your Secretary Name / Station.");
        return;
      }

      let eventId, eventTitle, ay = "2026-2027", isNew = false;

      if (isCreatingNewEvent) {
        const titleInput = document.getElementById("newEventTitle").value.trim();
        if (!titleInput) {
          alert("Please specify a title for the new event.");
          return;
        }
        eventId = "EVT-" + Date.now().toString().slice(-6);
        eventTitle = titleInput;
        ay = document.getElementById("newEventAY").value.trim() || "2026-2027";
        isNew = true;
      } else {
        const select = document.getElementById("eventSelect");
        eventId = select.value;
        eventTitle = select.options[select.selectedIndex]?.text || "Campus Event";
      }

      activeSession = { eventId, eventTitle, secretary, academicYear: ay, isNewEvent: isNew };
      localStorage.setItem("scanmate_session", JSON.stringify(activeSession));

      resumeScannerView();
    }

    function resumeScannerView() {
      document.getElementById("setupView").style.display = "none";
      document.getElementById("scannerView").style.display = "block";
      document.getElementById("activeEventTitle").innerText = activeSession.eventTitle;
      document.getElementById("activeSecretaryName").innerText = "Operator: " + activeSession.secretary;
      updateQueueUI();
      launchCamera();
    }

    function launchCamera() {
      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 15, qrbox: { width: 250, height: 250 } },
        handleScanSuccess
      ).catch(err => console.error("Camera access failed:", err));
    }

    function handleScanSuccess(decodedText) {
      if (isModalActive) return;

      const cleanId = decodedText.trim();
      const now = Date.now();

      if (cleanId === lastScan.id && (now - lastScan.time) < 2500) return;
      lastScan = { id: cleanId, time: now };

      if (sessionScannedIds.has(cleanId)) {
        const student = rosterCache[cleanId];
        const studentName = student ? student.name : cleanId;
        playChime("duplicate");
        triggerPillFeedback("duplicate", `Already recorded: ${studentName}`);
        return;
      }

      const student = rosterCache[cleanId];
      if (student) {
        sessionScannedIds.add(cleanId);
        localStorage.setItem("session_scanned_ids", JSON.stringify([...sessionScannedIds]));

        playChime("valid");
        triggerPillFeedback("valid", `Recorded: ${student.name}`);
        appendQueueRecord({
          studentId: cleanId,
          name: student.name,
          program: student.program,
          year: student.year,
          isWalkin: false,
          scannedAt: new Date().toISOString()
        });
      } else {
        playChime("invalid");
        triggerPillFeedback("invalid", `Unregistered: ${cleanId}`);
        openWalkInModal(cleanId);
      }
    }

    function triggerPillFeedback(type, message) {
      const banner = document.getElementById("feedbackBanner");
      banner.style.display = "block";
      banner.innerText = message;

      if (type === "valid") {
        document.body.className = "scan-valid";
        banner.style.background = "#059669";
        banner.style.color = "#ffffff";
      } else if (type === "duplicate") {
        document.body.className = "scan-duplicate";
        banner.style.background = "#d97706";
        banner.style.color = "#ffffff";
      } else {
        document.body.className = "scan-invalid";
        banner.style.background = "#dc2626";
        banner.style.color = "#ffffff";
      }

      setTimeout(() => {
        document.body.className = "";
        banner.style.display = "none";
      }, 1800);
    }

    function appendQueueRecord(record) {
      scanQueue.push(record);
      localStorage.setItem("scanmate_queue", JSON.stringify(scanQueue));
      updateQueueUI();

      if (navigator.onLine) {
        syncQueueToServer();
      }
    }

    function updateQueueUI() {
      document.getElementById("queueCount").innerText = scanQueue.length;
    }

    function openWalkInModal(studentId) {
      isModalActive = true;
      document.getElementById("modalId").value = studentId;
      document.getElementById("modalName").value = "";
      document.getElementById("modalProgram").value = "";
      document.getElementById("modalYear").value = "";
      document.getElementById("walkInModal").classList.add("active");
    }

    function submitWalkIn() {
      const id = document.getElementById("modalId").value;
      const name = document.getElementById("modalName").value.trim();
      const program = document.getElementById("modalProgram").value.trim();
      const year = document.getElementById("modalYear").value.trim();

      if (!name) {
        alert("Full Name is required.");
        return;
      }

      rosterCache[id] = { name, program, year };
      localStorage.setItem("scanmate_roster", JSON.stringify(rosterCache));

      sessionScannedIds.add(id);
      localStorage.setItem("session_scanned_ids", JSON.stringify([...sessionScannedIds]));

      appendQueueRecord({
        studentId: id,
        name: name,
        program: program,
        year: year,
        isWalkin: true,
        addToRoster: true,
        scannedAt: new Date().toISOString()
      });

      closeModal("walkInModal");
      triggerPillFeedback("valid", `Walk-in Saved: ${name}`);
    }

    async function syncQueueToServer() {
      if (scanQueue.length === 0 || !activeSession) return;

      const recordsToPush = [...scanQueue];
      try {
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            eventId: activeSession.eventId,
            eventTitle: activeSession.eventTitle,
            academicYear: activeSession.academicYear,
            isNewEvent: activeSession.isNewEvent || false,
            scannedBy: activeSession.secretary,
            records: recordsToPush
          })
        });

        if (res.ok) {
          scanQueue = scanQueue.slice(recordsToPush.length);
          localStorage.setItem("scanmate_queue", JSON.stringify(scanQueue));
          activeSession.isNewEvent = false;
          localStorage.setItem("scanmate_session", JSON.stringify(activeSession));
          updateQueueUI();
        }
      } catch (err) {
        console.log("Device offline; queued records remain safe in LocalStorage.");
      }
    }

    function triggerManualSync() {
      if (!navigator.onLine) {
        alert("Device is offline. Connect to Wi-Fi or data first.");
        return;
      }
      syncQueueToServer();
    }

    function exitSession() {
      if (scanQueue.length > 0) {
        if (!confirm(`You have ${scanQueue.length} unsynced records. End session anyway?`)) {
          return;
        }
      }
      localStorage.removeItem("scanmate_session");
      localStorage.removeItem("session_scanned_ids");
      location.reload();
    }

    window.addEventListener("online", () => {
      document.getElementById("netStatus").innerText = "ONLINE";
      document.getElementById("netStatus").className = "badge online";
      syncQueueToServer();
    });

    window.addEventListener("offline", () => {
      document.getElementById("netStatus").innerText = "OFFLINE";
      document.getElementById("netStatus").className = "badge offline";
    });

    initApp();
  </script>
</body>
</html>
